<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="description" content="Contador automático de billetes con IA. Detecta y suma billetes en tiempo real usando la cámara.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DetectorPro">
    <link rel="manifest" href="manifest.json">
    <title>Detector Billetes Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background:
                radial-gradient(ellipse at top left, rgba(0, 204, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at bottom right, rgba(0, 255, 136, 0.08) 0%, transparent 50%),
                linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .main-container {
            position: relative;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 0;
        }

        .camera-wrapper {
            position: relative;
            width: 800px;
            height: 600px;
            max-width: 95vw;
            max-height: 90vh;
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                0 8px 32px rgba(0, 255, 136, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            background: #000;
        }

        .detection-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.8) 70%, transparent 100%);
            padding: 15px;
            z-index: 10;
            transition: all 0.3s;
        }

        .detection-value {
            text-align: center;
            margin-bottom: 10px;
        }

        .detection-value-amount {
            font-size: 32px;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            margin-bottom: 5px;
        }

        .detection-value-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detection-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 12px;
            max-height: 60px;
            overflow-y: auto;
        }

        .detection-badge {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.4);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 12px;
            color: #00ff88;
            white-space: nowrap;
        }

        .detection-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-overlay {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-overlay-save {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #000;
        }

        .btn-overlay-clear {
            background: rgba(255, 170, 0, 0.3);
            border: 1px solid #ffaa00;
            color: #ffaa00;
        }

        .btn-overlay:active {
            transform: scale(0.95);
        }

        .btn-overlay:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .detection-empty {
            text-align: center;
            color: #666;
            font-size: 12px;
            padding: 5px;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #capturedImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 5;
        }

        .btn-capture {
            position: absolute;
            bottom: 85px;
            right: 15px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00ccff, #0088ff);
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 204, 255, 0.6);
            cursor: pointer;
            z-index: 25;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.3s;
        }

        .btn-capture:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(0, 204, 255, 0.8);
        }

        .btn-capture:active {
            transform: scale(0.95);
        }

        .btn-capture:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-capture.processing {
            background: linear-gradient(135deg, #ffaa00, #ff6600);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .mode-indicator {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 204, 255, 0.2);
            border: 1px solid rgba(0, 204, 255, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            color: #00ccff;
            z-index: 25;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
            pointer-events: none;
        }

        .btn-menu-left {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #00ccff, #0088ff);
            border: none;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 204, 255, 0.4);
            transition: all 0.3s;
            z-index: 100;
        }

        .btn-menu-left:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .btn-menu-left:active {
            transform: translateY(-50%) scale(0.95);
        }

        .btn-menu-right {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, #00ff88, #00cc66);
            border: none;
            color: #000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
            transition: all 0.3s;
            z-index: 100;
        }

        .btn-menu-right:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .btn-menu-right:active {
            transform: translateY(-50%) scale(0.95);
        }

        .panel-left {
            position: fixed;
            left: -350px;
            top: 0;
            width: 350px;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            transition: left 0.3s ease;
            z-index: 200;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 5px 0 20px rgba(0, 0, 0, 0.5);
        }

        .panel-left.open {
            left: 0;
        }

        .panel-right {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            transition: right 0.3s ease;
            z-index: 200;
            overflow-y: auto;
            padding: 20px;
            box-shadow: -5px 0 20px rgba(0, 0, 0, 0.5);
        }

        .panel-right.open {
            right: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .panel-header h2 {
            font-size: 24px;
            background: linear-gradient(45deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-close {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-close:hover {
            background: rgba(255, 68, 68, 0.4);
        }

        .control-button {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-camera {
            background: linear-gradient(135deg, #00ccff, #0088ff);
            color: #fff;
        }

        .btn-image {
            background: linear-gradient(135deg, #ff9500, #ff5e00);
            color: #fff;
        }

        .btn-clear-current {
            background: linear-gradient(135deg, #ffaa00, #ff6600);
            color: #fff;
        }

        .control-button:active {
            transform: scale(0.95);
        }

        .control-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .control-panel h3 {
            font-size: 14px;
            color: #00ff88;
            margin-bottom: 12px;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .control-row label {
            font-size: 13px;
            color: #aaa;
        }

        .control-row input[type="range"] {
            flex: 1;
            margin: 0 10px;
        }

        .control-row span {
            color: #00ff88;
            font-weight: bold;
            min-width: 50px;
            text-align: right;
            font-size: 13px;
        }

        .status-panel {
            background: rgba(0, 204, 255, 0.1);
            border: 1px solid rgba(0, 204, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
            color: #00ccff;
        }

        .historial-header {
            background: rgba(0, 255, 136, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }

        .historial-total {
            font-size: 36px;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 5px;
        }

        .historial-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }

        .historial-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .historial-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .historial-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .historial-item-valor {
            font-size: 20px;
            font-weight: bold;
            color: #00ff88;
        }

        .historial-item-desglose {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 5px;
        }

        .historial-item-fecha {
            font-size: 11px;
            color: #666;
        }

        .btn-eliminar {
            background: rgba(255, 68, 68, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-eliminar .icon {
            width: 14px;
            height: 14px;
        }

        .btn-capture .icon,
        .btn-menu-left .icon,
        .btn-menu-right .icon {
            width: 26px;
            height: 26px;
        }

        .btn-close .icon {
            width: 16px;
            height: 16px;
        }

        .toast .icon {
            width: 16px;
            height: 16px;
        }

        .panel-header h2 .icon,
        .mode-indicator .icon {
            width: 16px;
            height: 16px;
        }

        .control-panel h3 .icon {
            width: 14px;
            height: 14px;
        }

        .btn-eliminar:hover {
            background: rgba(255, 68, 68, 0.4);
        }

        .btn-limpiar-historial {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .btn-limpiar-historial:active {
            transform: scale(0.95);
        }

        .empty-message {
            text-align: center;
            color: #666;
            font-size: 13px;
            padding: 30px 20px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 150;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        @media (max-width: 1024px) {
            .camera-wrapper {
                width: 100%;
                height: auto;
                aspect-ratio: 4/3;
            }
        }

        @media (max-width: 768px) {
            body {
                overflow-y: auto;
            }

            .main-container {
                min-height: 100vh;
                min-height: 100dvh;
                padding: 5px 0;
            }

            .camera-wrapper {
                max-width: 96vw;
                max-height: 78dvh;
                aspect-ratio: 3/4;
            }

            .panel-left, .panel-right {
                width: min(90vw, 360px);
            }

            .btn-menu-left, .btn-menu-right {
                width: 52px;
                height: 52px;
                font-size: 22px;
            }

            .btn-menu-left {
                left: 10px;
            }

            .btn-menu-right {
                right: 10px;
            }

            .btn-capture {
                width: 60px;
                height: 60px;
                font-size: 26px;
                bottom: 90px;
            }

            .status-panel {
                font-size: 11px;
                padding: 8px;
            }

            .mode-indicator {
                font-size: 10px;
                padding: 6px 12px;
            }

            .detection-value-amount {
                font-size: 28px;
            }
        }

        @media (max-width: 480px) {
            .camera-wrapper {
                max-width: 100vw;
                max-height: 75dvh;
                border-radius: 0;
            }

            .detection-overlay {
                padding: 10px;
            }

            .detection-value-amount {
                font-size: 24px;
            }

            .detection-actions {
                gap: 6px;
            }

            .btn-overlay {
                padding: 9px;
                font-size: 11px;
            }

            .detection-badge {
                padding: 3px 8px;
                font-size: 11px;
            }

            .stats-panel {
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }

            .stat-card {
                padding: 8px;
            }

            .stat-card-value {
                font-size: 15px;
            }

            .panel-left, .panel-right {
                width: 100vw;
                border-radius: 0;
            }

            .btn-menu-left, .btn-menu-right {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .main-container {
                padding: 5px;
            }

            .camera-wrapper {
                max-height: 95dvh;
                aspect-ratio: 16/9;
            }

            .btn-menu-left, .btn-menu-right {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }

            .detection-overlay {
                padding: 8px;
            }

            .detection-value-amount {
                font-size: 22px;
            }

            .detection-value-label {
                display: none;
            }

            .detection-items {
                max-height: 40px;
                margin-bottom: 6px;
            }

            .btn-overlay {
                padding: 6px;
                font-size: 11px;
            }

            .btn-capture {
                width: 50px;
                height: 50px;
                font-size: 22px;
                bottom: 60px;
            }
        }

        .capture-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 30;
        }

        .capture-flash.active {
            animation: flashAnim 0.3s ease-out;
        }

        @keyframes flashAnim {
            0% { opacity: 0; }
            20% { opacity: 0.85; }
            100% { opacity: 0; }
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 40;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: none;
        }

        .loading-spinner.active {
            display: flex;
        }

        .spinner-ring {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 255, 136, 0.2);
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .spinner-text {
            color: #00ff88;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .historial-filter {
            position: relative;
            margin-bottom: 12px;
        }

        .historial-filter input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .historial-filter input::placeholder {
            color: #555;
        }

        .historial-filter input:focus {
            border-color: rgba(0, 255, 136, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .historial-filter::before {
            content: '';
            position: absolute;
            left: 12px;
            top: 50%;
            width: 14px;
            height: 14px;
            transform: translateY(-50%);
            pointer-events: none;
            opacity: 0.5;
            background-repeat: no-repeat;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ffffff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
            background-size: contain;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        input[type="file"] {
            display: none;
        }

        .icon {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .icon-sm { width: 14px; height: 14px; }
        .icon-lg { width: 26px; height: 26px; }
        .icon-xl { width: 32px; height: 32px; }

        .with-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .control-button, .btn-overlay, .btn-export, .btn-limpiar-historial {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-eliminar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 8px;
        }

        .btn-menu-left, .btn-menu-right, .btn-close {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-capture {
            align-items: center;
            justify-content: center;
        }

        .panel-header h2, .control-panel h3 {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.92);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.4);
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.25);
            max-width: 90vw;
            text-align: center;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.4);
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.25);
        }

        .toast.warn {
            color: #ffaa00;
            border-color: rgba(255, 170, 0, 0.4);
            box-shadow: 0 4px 20px rgba(255, 170, 0, 0.25);
        }

        .stats-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .stat-card-value {
            font-size: 18px;
            font-weight: bold;
            color: #00ccff;
            margin-bottom: 2px;
        }

        .stat-card-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-export {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #00ccff, #0088ff);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            text-transform: uppercase;
            transition: transform 0.2s;
        }

        .btn-export:active {
            transform: scale(0.95);
        }

        .btn-export:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .kbd-hint {
            font-size: 10px;
            color: #555;
            text-align: center;
            margin-top: 10px;
            line-height: 1.6;
        }

        .kbd-hint kbd {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            padding: 1px 5px;
            font-family: monospace;

            color: #aaa;
        }

        @media (max-width: 768px) {
            .kbd-hint { display: none; }
            .toast { bottom: 100px; font-size: 12px; padding: 10px 18px; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="camera-wrapper">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <img id="capturedImage" alt="Captura">
            
            <div class="mode-indicator with-icon" id="modeIndicator" data-icon="camera"><span>MODO CAPTURA</span></div>

            <div class="capture-flash" id="captureFlash"></div>

            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner-ring"></div>
                <div class="spinner-text" id="spinnerText">CARGANDO MODELO...</div>
            </div>
            
            <button class="btn-capture" id="btnCapture" onclick="capturarYDetectar()" aria-label="Capturar" data-icon="camera"></button>
            
            <div class="detection-overlay">
                <div class="detection-value">
                    <div class="detection-value-amount" id="detectionAmount">$0</div>
                    <div class="detection-value-label">Detección Actual</div>
                </div>
                
                <div class="detection-items" id="detectionItems">
                    <div class="detection-empty">Sin detecciones</div>
                </div>
                
                <div class="detection-actions">
                    <button class="btn-overlay btn-overlay-save" onclick="guardarDeteccionActual()" id="btnGuardarOverlay" data-icon="save"><span>GUARDAR</span></button>
                    <button class="btn-overlay btn-overlay-clear" onclick="limpiarDeteccionActual()" id="btnLimpiarOverlay" data-icon="trash"><span>LIMPIAR</span></button>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-menu-left" onclick="togglePanelLeft()" aria-label="Controles" data-icon="sliders"></button>
    <button class="btn-menu-right" onclick="togglePanelRight()" aria-label="Historial" data-icon="dollar"></button>

    <div class="overlay" id="overlay" onclick="closePanels()"></div>

    <div class="panel-left" id="panelLeft">
        <div class="panel-header">
            <h2 data-icon="sliders"><span>Controles</span></h2>
            <button class="btn-close" onclick="togglePanelLeft()" aria-label="Cerrar" data-icon="close"></button>
        </div>

        <div class="status-panel" id="status">
            Presiona iniciar cámara
        </div>

        <button class="control-button btn-camera" id="btnStart" onclick="iniciarCamara()" data-icon="video">
            <span>INICIAR CÁMARA</span>
        </button>

        <button class="control-button btn-image" onclick="probarConImagen()" data-icon="image">
            <span>SUBIR IMAGEN</span>
        </button>

        <button class="control-button" id="btnSwitchCamera" onclick="cambiarCamara()" style="background: linear-gradient(135deg, #9d4edd, #7b2cbf); color: #fff; display: none;" data-icon="refresh">
            <span>CAMBIAR CÁMARA</span>
        </button>

        <div class="control-panel">
            <h3 data-icon="target"><span>Ajustes de Detección</span></h3>
            <div class="control-row">
                <label>Confianza:</label>
                <input type="range" id="confSlider" min="10" max="90" value="35" oninput="actualizarConf(this.value)">
                <span id="confValue">35%</span>
            </div>
        </div>

        <div class="kbd-hint" id="kbdHint">
            Atajos:
            <kbd>Espacio</kbd> capturar ·
            <kbd>G</kbd> guardar ·
            <kbd>L</kbd> limpiar ·
            <kbd>H</kbd> historial
        </div>
    </div>

    <div class="panel-right" id="panelRight">
        <div class="panel-header">
            <h2 data-icon="history"><span>Historial</span></h2>
            <button class="btn-close" onclick="togglePanelRight()" aria-label="Cerrar" data-icon="close"></button>
        </div>

        <div class="historial-header">
            <div class="historial-total" id="totalHistorial">$0</div>
            <div class="historial-label">Total Acumulado</div>
        </div>

        <div class="historial-filter">
            <input type="text" id="historialFilter" placeholder="Buscar por valor, fecha o billete..." oninput="filtrarHistorial(this.value)">
        </div>

        <div class="stats-panel" id="statsPanel">
            <div class="stat-card">
                <div class="stat-card-value" id="statCount">0</div>
                <div class="stat-card-label">Registros</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="statAvg">$0</div>
                <div class="stat-card-label">Promedio</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="statMax">$0</div>
                <div class="stat-card-label">Mayor</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-value" id="statBilletes">0</div>
                <div class="stat-card-label">Billetes</div>
            </div>
        </div>

        <button class="btn-export" id="btnExportar" onclick="exportarHistorial()" disabled data-icon="download">
            <span>EXPORTAR HISTORIAL (JSON)</span>
        </button>

        <div id="historialList">
            <div class="empty-message">No hay registros guardados</div>
        </div>

        <button class="btn-limpiar-historial" onclick="limpiarHistorial()" data-icon="trash">
            <span>LIMPIAR TODO EL HISTORIAL</span>
        </button>
    </div>

    <input type="file" id="imageInput" accept="image/*" onchange="procesarImagen(this)">

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script>
        // set de iconos SVG (Feather-style). se inyectan en [data-icon="nombre"] al cargar
        const ICONS = {
            camera: '<svg class="icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
            video: '<svg class="icon" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',
            image: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
            save: '<svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>',
            trash: '<svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
            sliders: '<svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>',
            dollar: '<svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
            close: '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
            refresh: '<svg class="icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
            target: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
            history: '<svg class="icon" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/><line x1="12" y1="7" x2="12" y2="12"/><line x1="12" y1="12" x2="16" y2="14"/></svg>',
            download: '<svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
            stop: '<svg class="icon" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>',
            eye: '<svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
            search: '<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
            check: '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>',
            warn: '<svg class="icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
            error: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
            lock: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
            cameraOff: '<svg class="icon" viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3m3-3h6l2 3h4a2 2 0 0 1 2 2v9.34m-7.72-2.06a4 4 0 1 1-5.56-5.56"/></svg>',
            pause: '<svg class="icon" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
        };

        function inyectarIconos(scope) {
            (scope || document).querySelectorAll('[data-icon]').forEach(el => {
                const name = el.dataset.icon;
                if (!ICONS[name] || el.dataset.iconDone === '1') return;
                el.insertAdjacentHTML('afterbegin', ICONS[name]);
                el.dataset.iconDone = '1';
            });
        }

        // orden EXACTO con el que se entreno el modelo, no tocar
        const CLASS_NAMES = ['100', '1000', '10000', '100000', '200', '2000', '20000', '50', '500', '5000', '50000'];
        
        const VALORES = {
            "100": 100, "1000": 1000, "10000": 10000, "100000": 100000,
            "200": 200, "2000": 2000, "20000": 20000,
            "50": 50, "500": 500, "5000": 5000, "50000": 50000
        };

        let CONF_THRESHOLD = 0.35;
        const IOU_THRESHOLD = 0.4; // overlap maximo entre cajas antes de descartar duplicado
        let INPUT_SIZE = 640;      // el modelo espera 640x640

        let video, canvas, ctx, capturedImage;
        let stream = null;
        let deteccionesActuales = {};
        let historial = [];
        let session = null;
        let camarasDisponibles = [];
        let camaraActualIndex = 0;
        let camaraActiva = false;
        let esMobil = false;
        let deteccionActiva = false;
        let procesando = false;

        function togglePanelLeft() {
            const panel = document.getElementById('panelLeft');
            const overlay = document.getElementById('overlay');
            const panelRight = document.getElementById('panelRight');
            
            panel.classList.toggle('open');
            
            if (panel.classList.contains('open')) {
                overlay.classList.add('active');
                panelRight.classList.remove('open');
            } else {
                overlay.classList.remove('active');
            }
        }

        function togglePanelRight() {
            const panel = document.getElementById('panelRight');
            const overlay = document.getElementById('overlay');
            const panelLeft = document.getElementById('panelLeft');
            
            panel.classList.toggle('open');
            
            if (panel.classList.contains('open')) {
                overlay.classList.add('active');
                panelLeft.classList.remove('open');
            } else {
                overlay.classList.remove('active');
            }
        }

        function closePanels() {
            document.getElementById('panelLeft').classList.remove('open');
            document.getElementById('panelRight').classList.remove('open');
            document.getElementById('overlay').classList.remove('active');
        }

        function actualizarConf(value) {
            CONF_THRESHOLD = value / 100;
            document.getElementById('confValue').textContent = value + '%';
            try { localStorage.setItem('conf_threshold', value); } catch (e) {}
        }

        function cargarPreferencias() {
            try {
                const conf = localStorage.getItem('conf_threshold');
                if (conf) {
                    const slider = document.getElementById('confSlider');
                    if (slider) {
                        slider.value = conf;
                        CONF_THRESHOLD = conf / 100;
                        document.getElementById('confValue').textContent = conf + '%';
                    }
                }
            } catch (e) {}
        }

        let toastTimer = null;
        function mostrarToast(mensaje, tipo) {
            const toast = document.getElementById('toast');
            const iconName = tipo === 'error' ? 'error' : tipo === 'warn' ? 'warn' : 'check';
            const iconSvg = ICONS[iconName] || '';
            toast.innerHTML = iconSvg + '<span>' + mensaje + '</span>';
            toast.className = 'toast show' + (tipo ? ' ' + tipo : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.className = 'toast' + (tipo ? ' ' + tipo : '');
            }, 2200);
        }

        function cargarHistorial() {
            const saved = localStorage.getItem('historial_billetes');
            if (saved) {
                try {
                    historial = JSON.parse(saved);
                } catch (err) {
                    console.warn('Historial corrupto, reiniciando:', err);
                    historial = [];
                }
            }
            actualizarHistorialUI();
        }

        function calcularTotalHistorial() {
            return historial.reduce((sum, item) => sum + item.total, 0);
        }

        window.onload = async function() {
            inyectarIconos();

            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            capturedImage = document.getElementById('capturedImage');

            cargarHistorial();
            actualizarOverlayDeteccion();
            // si el usuario ya toco el slider antes, respetamos su valor en vez del default por dispositivo
            const hayConfGuardada = localStorage.getItem('conf_threshold') !== null;

            const status = document.getElementById('status');
            const btnSwitchCamera = document.getElementById('btnSwitchCamera');
            const btnCapture = document.getElementById('btnCapture');
            const modeIndicator = document.getElementById('modeIndicator');

            // en movil hacemos captura manual (es muy pesado correr inferencia continua)
            // en PC corremos deteccion automatica cada ~800ms
            esMobil = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            if (esMobil) {
                console.log('Modo movil - Deteccion por captura');
                INPUT_SIZE = 640;
                if (!hayConfGuardada) CONF_THRESHOLD = 0.30;

                btnCapture.style.display = 'flex';
                modeIndicator.style.display = 'flex';
                modeIndicator.dataset.icon = 'camera';
                modeIndicator.dataset.iconDone = '';
                modeIndicator.innerHTML = '<span>MODO CAPTURA</span>';
                inyectarIconos(modeIndicator.parentElement);

                try {
                    const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    tempStream.getTracks().forEach(track => track.stop());

                    const devices = await navigator.mediaDevices.enumerateDevices();
                    camarasDisponibles = devices.filter(d => d.kind === 'videoinput');

                    if (camarasDisponibles.length >= 1) {
                        btnSwitchCamera.style.display = 'flex';
                    }
                } catch (error) {
                    console.warn('Error detectando camaras:', error);
                    btnSwitchCamera.style.display = 'flex';
                }
            } else {
                console.log('Modo PC - Deteccion automatica continua');
                INPUT_SIZE = 640;
                if (!hayConfGuardada) CONF_THRESHOLD = 0.40;

                btnCapture.style.display = 'none';
                modeIndicator.style.display = 'flex';
                modeIndicator.style.background = 'rgba(0, 255, 136, 0.2)';
                modeIndicator.style.borderColor = 'rgba(0, 255, 136, 0.5)';
                modeIndicator.style.color = '#00ff88';
                modeIndicator.dataset.icon = 'eye';
                modeIndicator.dataset.iconDone = '';
                modeIndicator.innerHTML = '<span>DETECCIÓN AUTOMÁTICA</span>';
                inyectarIconos(modeIndicator.parentElement);
            }

            cargarPreferencias();

            const spinner = document.getElementById('loadingSpinner');
            const spinnerText = document.getElementById('spinnerText');

            try {
                spinner.classList.add('active');
                spinnerText.textContent = 'CARGANDO MODELO...';
                status.textContent = 'Cargando modelo IA...';
                session = await ort.InferenceSession.create('models/best.onnx');
                console.log('MODELO CARGADO');
                status.textContent = 'Listo - Presiona INICIAR';
                spinner.classList.remove('active');
            } catch (error) {
                console.error('ERROR cargando modelo:', error);
                status.textContent = 'Modelo no encontrado';
                spinnerText.textContent = 'MODELO NO DISPONIBLE';
                spinner.querySelector('.spinner-ring').style.borderTopColor = '#ff6b6b';
                spinner.querySelector('.spinner-ring').style.animation = 'none';
                mostrarToast('No se pudo cargar el modelo', 'error');
            }
        };

        async function iniciarCamara() {
            if (!session) {
                mostrarToast('Modelo no cargado', 'warn');
                return;
            }

            if (camaraActiva) {
                detenerCamara();
                return;
            }

            try {
                document.getElementById('status').textContent = 'Iniciando cámara...';
                document.getElementById('btnStart').disabled = true;

                // ideal en vez de exact para que no truene si la camara no soporta full HD
                const constraints = {
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                if (camarasDisponibles.length > 0) {
                    const camara = camarasDisponibles[camaraActualIndex];
                    constraints.video.deviceId = { exact: camara.deviceId };
                }

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                video.play().catch(err => console.warn('Error video:', err));
                
                video.onloadedmetadata = function() {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    camaraActiva = true;
                    
                    if (esMobil) {
                        document.getElementById('status').textContent = 'Cámara lista - Presiona el botón para capturar';
                        document.getElementById('btnCapture').style.display = 'flex';
                    } else {
                        document.getElementById('status').textContent = 'Detectando automáticamente...';
                        deteccionActiva = true;
                        detectarContinuo();
                    }

                    const btnStart = document.getElementById('btnStart');
                    btnStart.dataset.icon = 'stop';
                    btnStart.dataset.iconDone = '';
                    btnStart.innerHTML = '<span>DETENER CÁMARA</span>';
                    btnStart.className = 'control-button btn-clear-current';
                    btnStart.disabled = false;
                    inyectarIconos();
                };

            } catch (error) {
                console.error('Error cámara:', error);
                const status = document.getElementById('status');

                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    status.textContent = 'Permiso denegado. Habilita la cámara en ajustes del navegador';
                    mostrarToast('Habilita la cámara en ajustes del navegador', 'error');
                } else if (error.name === 'NotFoundError' || error.name === 'DevicesNotFoundError') {
                    status.textContent = 'No se encontró ninguna cámara';
                    mostrarToast('No hay cámara disponible', 'error');
                } else if (error.name === 'NotReadableError' || error.name === 'TrackStartError') {
                    status.textContent = 'Cámara en uso por otra app';
                    mostrarToast('Cierra otras apps que usen la cámara', 'error');
                } else if (error.name === 'OverconstrainedError') {
                    status.textContent = 'Cámara no soporta esta configuración';
                    mostrarToast('Configuración de cámara no soportada', 'error');
                } else {
                    status.textContent = 'Error con cámara: ' + (error.message || error.name);
                    mostrarToast('Error al iniciar cámara', 'error');
                }

                document.getElementById('btnStart').disabled = false;
            }
        }

        async function cambiarCamara() {
            if (camarasDisponibles.length <= 1) {
                mostrarToast('Solo hay una cámara disponible', 'warn');
                return;
            }

            camaraActualIndex = (camaraActualIndex + 1) % camarasDisponibles.length;

            const cameraActual = camarasDisponibles[camaraActualIndex];
            const nombreCamara = cameraActual.label || `Cámara ${camaraActualIndex + 1}`;
            console.log('Cambiando a:', nombreCamara);

            if (camaraActiva) {
                detenerCamara();
                setTimeout(() => {
                    iniciarCamara();
                }, 500);
            } else {
                document.getElementById('status').textContent = `${nombreCamara} seleccionada`;
            }
        }

        function detenerCamara() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                camaraActiva = false;
                deteccionActiva = false;
                procesando = false;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                capturedImage.style.display = 'none';
                
                document.getElementById('status').textContent = 'Detenido';
                const btnStart = document.getElementById('btnStart');
                btnStart.dataset.icon = 'video';
                btnStart.dataset.iconDone = '';
                btnStart.innerHTML = '<span>INICIAR CÁMARA</span>';
                btnStart.className = 'control-button btn-camera';
                document.getElementById('btnCapture').style.display = 'none';
                inyectarIconos();
            }
        }

        async function detectarContinuo() {
            if (!deteccionActiva || !camaraActiva || !session || procesando) {
                if (deteccionActiva && camaraActiva) {
                    setTimeout(detectarContinuo, 800);
                }
                return;
            }

            procesando = true;

            try {
                const deteccionesFiltradas = await ejecutarDeteccionSobre(video);
                actualizarDeteccionesActuales(deteccionesFiltradas);
            } catch (error) {
                console.error('Error detección:', error);
            }

            procesando = false;
            // 800ms da espacio al GC y mantiene la UI responsiva
            setTimeout(detectarContinuo, 800);
        }

        async function capturarYDetectar() {
            if (!camaraActiva || !session || procesando) return;

            procesando = true;
            const btnCapture = document.getElementById('btnCapture');
            btnCapture.classList.add('processing');
            btnCapture.disabled = true;

            // trigger del flash: hay que forzar reflow leyendo offsetWidth
            // sino el navegador batchea y no se reinicia la animacion
            const flash = document.getElementById('captureFlash');
            flash.classList.remove('active');
            void flash.offsetWidth;
            flash.classList.add('active');

            video.pause();

            document.getElementById('status').textContent = 'Analizando...';

            requestAnimationFrame(async () => {
                try {
                    const startTime = performance.now();
                    
                    // limitamos a 1280px porque celulares con camara de 4k tronaban memoria
                    const maxDimension = 1280;
                    let drawWidth = canvas.width;
                    let drawHeight = canvas.height;

                    if (canvas.width > maxDimension || canvas.height > maxDimension) {
                        const scale = maxDimension / Math.max(canvas.width, canvas.height);
                        drawWidth = canvas.width * scale;
                        drawHeight = canvas.height * scale;
                        canvas.width = drawWidth;
                        canvas.height = drawHeight;
                    }
                    
                    ctx.drawImage(video, 0, 0, drawWidth, drawHeight);

                    capturedImage.src = canvas.toDataURL('image/jpeg', 0.85);
                    capturedImage.style.display = 'block';

                    const deteccionesFiltradas = await ejecutarDeteccionSobre(video);

                    const endTime = performance.now();
                    console.log(`Tiempo: ${(endTime - startTime).toFixed(0)}ms | Detecciones: ${deteccionesFiltradas.length}`);

                    actualizarDeteccionesActuales(deteccionesFiltradas);

                    document.getElementById('status').textContent =
                        deteccionesFiltradas.length > 0 ?
                        `${deteccionesFiltradas.length} billetes detectados` :
                        'No se detectaron billetes';

                } catch (error) {
                    console.error('Error detección:', error);
                    document.getElementById('status').textContent = 'Error al procesar';
                }

                btnCapture.classList.remove('processing');
                btnCapture.disabled = false;
                procesando = false;
            });
        }

        function actualizarOverlayDeteccion() {
            const totalActual = Object.entries(deteccionesActuales)
                .reduce((sum, [billete, cantidad]) => sum + (VALORES[billete] * cantidad), 0);
            
            document.getElementById('detectionAmount').textContent = `$${totalActual.toLocaleString()}`;
            
            const itemsDiv = document.getElementById('detectionItems');
            const btnGuardar = document.getElementById('btnGuardarOverlay');
            const btnLimpiar = document.getElementById('btnLimpiarOverlay');
            
            if (Object.keys(deteccionesActuales).length === 0) {
                itemsDiv.innerHTML = '<div class="detection-empty">Sin detecciones</div>';
                btnGuardar.disabled = true;
                btnLimpiar.disabled = true;
            } else {
                let html = '';
                for (let [billete, cantidad] of Object.entries(deteccionesActuales)) {
                    html += `<div class="detection-badge">${cantidad}x ${billete}</div>`;
                }
                itemsDiv.innerHTML = html;
                btnGuardar.disabled = false;
                btnLimpiar.disabled = false;
            }
        }

        // canvas reusable para no andar creando uno nuevo en cada frame (en PC se llama cada 800ms)
        let _preprocessCanvas = null;
        let _preprocessCtx = null;

        function preprocesarSource(source) {
            if (!_preprocessCanvas) {
                _preprocessCanvas = document.createElement('canvas');
                _preprocessCanvas.width = INPUT_SIZE;
                _preprocessCanvas.height = INPUT_SIZE;
                _preprocessCtx = _preprocessCanvas.getContext('2d', { willReadFrequently: true });
                _preprocessCtx.imageSmoothingEnabled = true;
                _preprocessCtx.imageSmoothingQuality = 'medium';
            } else if (_preprocessCanvas.width !== INPUT_SIZE) {
                _preprocessCanvas.width = INPUT_SIZE;
                _preprocessCanvas.height = INPUT_SIZE;
            }

            _preprocessCtx.drawImage(source, 0, 0, INPUT_SIZE, INPUT_SIZE);

            const imageData = _preprocessCtx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE);
            const { data } = imageData;

            // pasamos de RGBA intercalado (HWC) a planar RGB (CHW) que es lo que espera el modelo
            // R todo junto, despues G, despues B. normalizado a [0,1]
            const input = new Float32Array(3 * INPUT_SIZE * INPUT_SIZE);
            const pixelCount = INPUT_SIZE * INPUT_SIZE;

            for (let i = 0; i < pixelCount; i++) {
                const idx = i * 4;
                input[i] = data[idx] / 255.0;
                input[pixelCount + i] = data[idx + 1] / 255.0;
                input[pixelCount * 2 + i] = data[idx + 2] / 255.0;
            }

            return new ort.Tensor('float32', input, [1, 3, INPUT_SIZE, INPUT_SIZE]);
        }


        // el output de yolo viene como [4+numClases, numPredictions] traspuesto:
        // primero todos los xCenter, despues todos los yCenter, etc.
        // por eso los indices se ven raros (numPredictions * offset + i)
        function postprocesarResultados(outputData, imgWidth, imgHeight) {
            const detecciones = [];
            const numClases = CLASS_NAMES.length;
            const numPredictions = Math.floor(outputData.length / (4 + numClases));
            const scaleX = imgWidth / INPUT_SIZE;
            const scaleY = imgHeight / INPUT_SIZE;
            
            for (let i = 0; i < numPredictions; i++) {
                const xCenter = outputData[i];
                const yCenter = outputData[numPredictions + i];
                const width = outputData[numPredictions * 2 + i];
                const height = outputData[numPredictions * 3 + i];
                
                let maxScore = 0;
                let maxClassId = 0;
                
                for (let c = 0; c < numClases; c++) {
                    const score = outputData[numPredictions * (4 + c) + i];
                    if (score > maxScore) {
                        maxScore = score;
                        maxClassId = c;
                    }
                }
                
                if (maxScore > CONF_THRESHOLD) {
                    const x1 = Math.max(0, (xCenter - width / 2) * scaleX);
                    const y1 = Math.max(0, (yCenter - height / 2) * scaleY);
                    const x2 = Math.min(imgWidth, (xCenter + width / 2) * scaleX);
                    const y2 = Math.min(imgHeight, (yCenter + height / 2) * scaleY);
                    
                    detecciones.push({
                        class: CLASS_NAMES[maxClassId],
                        conf: maxScore,
                        bbox: [x1, y1, x2, y2]
                    });
                }
            }
            
            return detecciones;
        }

        // sin esto un mismo billete sale detectado 3-4 veces con cajas superpuestas
        // ordenamos por confianza y descartamos las cajas que se traslapan demasiado con una mejor
        function nonMaxSuppression(detecciones, iouThreshold) {
            detecciones.sort((a, b) => b.conf - a.conf);
            const resultado = [];
            const suppressed = new Array(detecciones.length).fill(false);

            for (let i = 0; i < detecciones.length; i++) {
                if (suppressed[i]) continue;
                resultado.push(detecciones[i]);

                for (let j = i + 1; j < detecciones.length; j++) {
                    if (suppressed[j]) continue;

                    // solo suprime si es la misma clase (no queremos borrar un $50 que esta encima de un $100)
                    if (detecciones[i].class === detecciones[j].class) {
                        const iou = calcularIoU(detecciones[i].bbox, detecciones[j].bbox);
                        if (iou > iouThreshold) {
                            suppressed[j] = true;
                        }
                    }
                }
            }

            return resultado;
        }

        function calcularIoU(bbox1, bbox2) {
            const [x1_1, y1_1, x2_1, y2_1] = bbox1;
            const [x1_2, y1_2, x2_2, y2_2] = bbox2;
            
            const xi1 = Math.max(x1_1, x1_2);
            const yi1 = Math.max(y1_1, y1_2);
            const xi2 = Math.min(x2_1, x2_2);
            const yi2 = Math.min(y2_1, y2_2);
            
            const interArea = Math.max(0, xi2 - xi1) * Math.max(0, yi2 - yi1);
            const bbox1Area = (x2_1 - x1_1) * (y2_1 - y1_1);
            const bbox2Area = (x2_2 - x1_2) * (y2_2 - y1_2);
            const unionArea = bbox1Area + bbox2Area - interArea;
            
            return unionArea > 0 ? interArea / unionArea : 0;
        }

        function dibujarDetecciones(detecciones) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 3;
            ctx.font = 'bold 16px Arial';
            
            for (const det of detecciones) {
                const [x1, y1, x2, y2] = det.bbox;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                
                const label = `${det.class} (${(det.conf * 100).toFixed(0)}%)`;
                const textWidth = ctx.measureText(label).width;
                
                ctx.fillStyle = '#00ff88';
                ctx.fillRect(x1, y1 - 25, textWidth + 10, 25);
                ctx.fillStyle = '#000';
                ctx.fillText(label, x1 + 5, y1 - 5);
            }
        }

        function guardarDeteccionActual() {
            if (Object.keys(deteccionesActuales).length === 0) {
                mostrarToast('No hay detecciones para guardar', 'warn');
                return;
            }

            const totalActual = Object.entries(deteccionesActuales)
                .reduce((sum, [billete, cantidad]) => sum + (VALORES[billete] * cantidad), 0);

            const registro = {
                id: Date.now(),
                timestamp: new Date().toLocaleString(),
                total: totalActual,
                desglose: {...deteccionesActuales}
            };

            historial.unshift(registro);
            localStorage.setItem('historial_billetes', JSON.stringify(historial));
            
            actualizarHistorialUI();

            const overlay = document.querySelector('.detection-overlay');
            overlay.style.borderTop = '3px solid #00ff88';

            mostrarToast(`Guardado $${totalActual.toLocaleString()}`);
            document.getElementById('status').textContent = 'Guardado en historial';

            setTimeout(() => {
                overlay.style.borderTop = 'none';
                deteccionesActuales = {};
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                capturedImage.style.display = 'none';
                actualizarOverlayDeteccion();
                
                if (camaraActiva && video.paused) {
                    video.play();
                }
                
                if (esMobil) {
                    document.getElementById('status').textContent = 'Listo para siguiente captura';
                } else {
                    document.getElementById('status').textContent = 'Guardado - Detectando...';
                }
            }, 500);
        }

        function limpiarDeteccionActual() {
            deteccionesActuales = {};
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            capturedImage.style.display = 'none';
            actualizarOverlayDeteccion();
            
            const overlay = document.querySelector('.detection-overlay');
            overlay.style.borderTop = '3px solid #ffaa00';
            setTimeout(() => {
                overlay.style.borderTop = 'none';
            }, 500);

            if (camaraActiva && video.paused) {
                video.play();
            }

            if (esMobil) {
                document.getElementById('status').textContent = 'Limpiado - Lista para nueva captura';
            } else {
                document.getElementById('status').textContent = 'Detección limpiada';
            }
        }

        function eliminarDelHistorial(id) {
            if (!confirm('¿Eliminar este registro?')) return;

            historial = historial.filter(item => item.id !== id);
            localStorage.setItem('historial_billetes', JSON.stringify(historial));
            actualizarHistorialUI();
            mostrarToast('Registro eliminado');
        }

        let filtroHistorial = '';

        function filtrarHistorial(valor) {
            filtroHistorial = valor.toLowerCase().trim();
            renderHistorialList();
        }

        function renderHistorialList() {
            const list = document.getElementById('historialList');
            const btnExportar = document.getElementById('btnExportar');

            const registros = filtroHistorial
                ? historial.filter(reg => {
                    if (String(reg.total).includes(filtroHistorial)) return true;
                    if (reg.timestamp.toLowerCase().includes(filtroHistorial)) return true;
                    return Object.keys(reg.desglose).some(b => b.includes(filtroHistorial));
                })
                : historial;

            if (historial.length === 0) {
                list.innerHTML = '<div class="empty-message">No hay registros guardados</div>';
                if (btnExportar) btnExportar.disabled = true;
                return;
            }

            if (btnExportar) btnExportar.disabled = false;

            if (registros.length === 0) {
                list.innerHTML = '<div class="empty-message">Sin resultados para "' + filtroHistorial + '"</div>';
                return;
            }

            let html = '';
            for (let reg of registros) {
                const desglose = Object.entries(reg.desglose)
                    .map(([b, c]) => `${c}x${b}`)
                    .join(', ');

                html += `
                    <div class="historial-item">
                        <div class="historial-item-header">
                            <div class="historial-item-valor">$${reg.total.toLocaleString()}</div>
                            <button class="btn-eliminar" onclick="eliminarDelHistorial(${reg.id})" aria-label="Eliminar">${ICONS.trash}</button>
                        </div>
                        <div class="historial-item-desglose">${desglose}</div>
                        <div class="historial-item-fecha">${reg.timestamp}</div>
                    </div>`;
            }
            list.innerHTML = html;
        }

        function actualizarHistorialUI() {
            const totalHistorial = calcularTotalHistorial();
            document.getElementById('totalHistorial').textContent = `$${totalHistorial.toLocaleString()}`;
            actualizarEstadisticas(totalHistorial);
            renderHistorialList();
        }

        function limpiarHistorial() {
            if (historial.length === 0) {
                mostrarToast('El historial ya está vacío', 'warn');
                return;
            }

            if (confirm('¿Limpiar TODO el historial? Esta acción no se puede deshacer.')) {
                historial = [];
                localStorage.removeItem('historial_billetes');
                actualizarHistorialUI();
                mostrarToast('Historial limpiado');
            }
        }

        function actualizarEstadisticas(total) {
            const count = historial.length;
            const avg = count > 0 ? Math.round(total / count) : 0;
            const max = count > 0 ? Math.max(...historial.map(r => r.total)) : 0;
            const totalBilletes = historial.reduce((sum, r) => {
                return sum + Object.values(r.desglose).reduce((s, c) => s + c, 0);
            }, 0);

            const el = id => document.getElementById(id);
            if (el('statCount')) el('statCount').textContent = count;
            if (el('statAvg')) el('statAvg').textContent = `$${avg.toLocaleString()}`;
            if (el('statMax')) el('statMax').textContent = `$${max.toLocaleString()}`;
            if (el('statBilletes')) el('statBilletes').textContent = totalBilletes;
        }

        function exportarHistorial() {
            if (historial.length === 0) {
                mostrarToast('Nada que exportar', 'warn');
                return;
            }

            const data = {
                exportado: new Date().toISOString(),
                total_acumulado: calcularTotalHistorial(),
                cantidad_registros: historial.length,
                registros: historial
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const fecha = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `historial_billetes_${fecha}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            mostrarToast('Historial exportado');
        }

        function probarConImagen() {
            if (!session) {
                mostrarToast('Modelo no cargado', 'warn');
                return;
            }
            document.getElementById('imageInput').click();
        }

        async function procesarImagen(input) {
            if (!input.files || !input.files[0]) return;
            
            const file = input.files[0];
            console.log('Procesando imagen:', file.name);
            
            const img = new Image();
            img.onload = async function() {
                if (stream) detenerCamara();
                
                canvas.width = img.width;
                canvas.height = img.height;
                
                capturedImage.src = img.src;
                capturedImage.style.display = 'block';
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                try {
                    document.getElementById('status').textContent = 'Analizando imagen...';

                    const deteccionesFiltradas = await ejecutarDeteccionSobre(img);
                    actualizarDeteccionesActuales(deteccionesFiltradas);

                    document.getElementById('status').textContent =
                        deteccionesFiltradas.length > 0 ?
                        `${deteccionesFiltradas.length} billetes detectados` :
                        'No se detectaron billetes';

                } catch (error) {
                    console.error('Error procesando imagen:', error);
                    document.getElementById('status').textContent = 'Error al procesar';
                    mostrarToast('Error al procesar imagen', 'error');
                }
            };
            
            img.src = URL.createObjectURL(file);
        }

        async function ejecutarDeteccionSobre(source) {
            const inputTensor = preprocesarSource(source);
            const feeds = {};
            feeds[session.inputNames[0]] = inputTensor;
            const results = await session.run(feeds);
            const output = results[session.outputNames[0]];
            const detecciones = postprocesarResultados(output.data, canvas.width, canvas.height);
            return nonMaxSuppression(detecciones, IOU_THRESHOLD);
        }

        function actualizarDeteccionesActuales(detecciones) {
            deteccionesActuales = {};
            for (const det of detecciones) {
                deteccionesActuales[det.class] = (deteccionesActuales[det.class] || 0) + 1;
            }
            actualizarOverlayDeteccion();
            dibujarDetecciones(detecciones);
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('[SW] Registrado:', reg.scope))
                    .catch(err => console.warn('[SW] Registro fallido:', err));
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            const key = e.key.toLowerCase();

            if (e.code === 'Space' && esMobil && camaraActiva && !procesando) {
                e.preventDefault();
                capturarYDetectar();
            } else if (key === 'g' && Object.keys(deteccionesActuales).length > 0) {
                guardarDeteccionActual();
            } else if (key === 'l' && Object.keys(deteccionesActuales).length > 0) {
                limpiarDeteccionActual();
            } else if (key === 'h') {
                togglePanelRight();
            } else if (key === 'c') {
                togglePanelLeft();
            } else if (key === 'escape') {
                closePanels();
            }
        });

        window.onbeforeunload = function() {
            if (stream) stream.getTracks().forEach(t => t.stop());
        };
    </script>
</body>
